spring.application.name=ms-vidasalud-notify

server.port=8083

# ---- RabbitMQ ----
# Se indican los dos nodos del clúster: si uno no responde, el cliente
# se conecta al otro automáticamente.
# En local son los puertos 5672 y 5673; en Docker, los nombres de los contenedores.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:vidasalud}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

management.endpoints.web.exposure.include=health,info
